<!doctype html>
<html lang="en">

    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #14101e;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #app canvas {
        position: absolute;

        color: #ffd83a;
        font: bold 28px monospace;
        align-items: center;
        justify-content: center;
      }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate {
          display: flex;
        }
      }
