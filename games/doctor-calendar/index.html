  <!-- Modern Web Guidance: Accessible Focus, Deferred :user-invalid, Responsive @container Table, Native <dialog> & [switch] -->
  <style>
    .visually-hidden:where(:not(:focus-within, :active)) {
      position: absolute !important;
      clip-path: inset(50%) !important;
      overflow: hidden !important;
      width: 1px !important;
      height: 1px !important;
      margin: -1px !important;
      padding: 0 !important;
      border: 0 !important;
      white-space: nowrap !important;
    }

    :where(a:any-link, button, input, select, textarea):focus-visible {
      outline: 3px solid #0284c7;
      outline-offset: 2px;
    }

    /* Deferred validation styling after user interaction (:user-invalid & fallback) */
    .ortho-input:user-invalid,
    .ortho-input.user-invalid-fallback {
      border-color: #dc2626 !important;
      background-color: #fef2f2 !important;
    }

    .ortho-input:user-valid,
    .ortho-input.user-valid-fallback {
      border-color: #16a34a !important;
    }

    .ortho-error-msg {
      display: none;
    }

    .ortho-input:user-invalid ~ .ortho-error-msg,
    .ortho-input.user-invalid-fallback ~ .ortho-error-msg {
      display: flex;
    }

    input[type="checkbox"],
    input[type="radio"] {
      accent-color: #0284c7;
    }

    /* Native Switch Control Styling (modern-web-guidance: switch) */
    input[type="checkbox"][switch] {
      accent-color: var(--accent-color, #0284c7);
      margin: 0;
      cursor: pointer;
    }

    input[type="checkbox"][switch]:focus-visible {
      outline: 3px solid var(--focus-color, #0284c7);
      outline-offset: 4px;
    }

    /* Native Modal Dialog Scroll Containment & Backdrop (modern-web-guidance: dialog & light-dismiss-a-dialog) */
    dialog:modal {
      overscroll-behavior: contain;
    }

    dialog::backdrop {
      overflow: hidden;
      overscroll-behavior: contain;
      background-color: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(3px);
    }

    /* Responsive Roster Table with Sticky Headers & @container Stacked Layout (modern-web-guidance: responsive-table) */
    .table-wrapper {
      overflow: auto;
      max-inline-size: 100%;
      max-block-size: min(640px, 82vh);
      container-type: inline-size;
    }

    .roster-table {
      border-collapse: separate;
      border-spacing: 0;
      width: 100%;
    }

    .roster-table thead {
      position: sticky;
      inset-block-start: 0;
      z-index: 2;
    }

    .roster-table tbody th {
      position: sticky;
      inset-inline-start: 0;
      background: #ffffff;
      z-index: 1;
    }

    .roster-table tbody tr:hover th {
      background: #f8fafc;
    }

    @container (width < 600px) {
      .roster-table,
      .roster-table thead,
      .roster-table tbody,
      .roster-table tr,
      .roster-table th,
      .roster-table td {
        display: block;
      }

      .roster-table thead {
        display: none;
      }

      .roster-table tbody tr {
        margin-block-end: 1rem;
        border: 1px solid #cbd5e1;
        border-radius: 0.75rem;
        overflow: hidden;
        background: #ffffff;
      }

      .roster-table tbody th {
        position: sticky;
        inset-block-start: 0;
        z-index: 2;
        background: #f1f5f9;
        border-bottom: 1px solid #e2e8f0;
      }

      .roster-table td {
        padding: 0.625rem 1rem !important;
        border-bottom: 1px solid #f1f5f9;
      }

      .roster-table td:nth-child(2)::before {
        content: var(--label-2) ": ";
        font-weight: 700;
        color: #475569;
        font-size: 0.7rem;
        text-transform: uppercase;
        display: block;
        margin-bottom: 0.15rem;
      }

      .roster-table td:nth-child(3)::before {
        content: var(--label-3) ": ";
        font-weight: 700;
        color: #475569;
        font-size: 0.7rem;
        text-transform: uppercase;
        display: inline-block;
        margin-right: 0.35rem;
      }

      .roster-table td:nth-child(4)::before {

        font-weight: 700;
        color: #475569;
        font-size: 0.7rem;
        text-transform: uppercase;

      .roster-table td:nth-child(5)::before {

  </style>

    // Helper to build calendar grid for a given year and month (0-indexed)
    function buildMonthDays(year, month) {
      const firstDayOfWeek = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const cells = [];
      for (let i = 0; i < firstDayOfWeek; i++) {
        cells.push(null);
      }
      for (let day = 1; day <= daysInMonth; day++) {
        const dateObj = new Date(year, month, day);
        const dayOfWeek = dateObj.getDay();
        const isSunday = dayOfWeek === 0;
        const isClosedSaturday = dayOfWeek === 6 && day !== 14 && day !== 21;
        const isPast = year === 2026 && month === 10 && day < 7;
        const available = !isSunday && !isClosedSaturday && !isPast;
        cells.push({
          day,
          dateObj,
          iso: `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`,
          available
        });
      }
      return cells;
    }

    function App() {
      const clinicData = window.CLINIC_DATA;

      // Top Demo Bar States
      const [lang, setLang] = useState("en");
      const [activeView, setActiveView] = useState("patient"); // "patient" | "admin"

      // 4-Step Patient Booking Wizard State
      const [step, setStep] = useState(1);
      const [selectedVisitId, setSelectedVisitId] = useState("new-patient-eval");
      const [expandedPrepId, setExpandedPrepId] = useState("new-patient-eval");

      // Calendar & Slot State (Defaulting to November 2026)
      const [calYear, setCalYear] = useState(2026);
      const [calMonth, setCalMonth] = useState(10);
      const [selectedDateIso, setSelectedDateIso] = useState("2026-11-10");
      const [selectedSlotId, setSelectedSlotId] = useState("10:00");

      // Step 3 Patient Intake State
      const [patientForm, setPatientForm] = useState({
        fullName: "",
        email: "",
        phone: "",
        insuranceId: "bcbs",
        memberId: "",
        injuredJoint: "knee",
        injurySide: "Right",
        clinicalNotes: "",
        hasImaging: true,
        smsOptIn: true
      });
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [statusToast, setStatusToast] = useState("");
      const formRef = useRef(null);
      const dirtyFieldsRef = useRef(new WeakMap());

      // Admin View States (Roster, Modal Preview & Schedule Settings)
      const [rosterFilter, setRosterFilter] = useState("all"); // "all" | "post-op" | "es"
      const [whatsappSentMap, setWhatsappSentMap] = useState({});
      const [activeModalPatient, setActiveModalPatient] = useState(null);
      const intakeDialogRef = useRef(null);

      // Schedule & Operating Room Settings State
      const [weeklySchedule, setWeeklySchedule] = useState(
        clinicData.adminDashboard.weeklyScheduleDefault
      );
      const [slotBufferMin, setSlotBufferMin] = useState(10);
      const [reserveUrgentFractureSlots, setReserveUrgentFractureSlots] = useState(true);
      const [autoBilingualSms, setAutoBilingualSms] = useState(true);

      const t = clinicData.translations[lang];
      const doctor = clinicData.doctor;

      // Keep <html lang="..."> and <title> synchronized with language & view transitions
      useEffect(() => {
        document.documentElement.lang = lang;
        const stepSuffix =
          activeView === "admin"
            ? t.adminView.title
            : step === 4
            ? t.wizard.step4Badge
            : t.pageTitle;
        document.title = `${stepSuffix} | ${doctor.name}`;
      }, [lang, activeView, step, t, doctor.name]);

      // Attach mandatory light-dismiss fallback & returnValue reset for native <dialog closedby="any">
      useEffect(() => {
        const dialogEl = intakeDialogRef.current;
        if (!dialogEl) return;

        const handleClose = () => {
          dialogEl.returnValue = "";
        };
        dialogEl.addEventListener("close", handleClose);

        let handleBackdropClick = null;
        if (!("closedBy" in HTMLDialogElement.prototype)) {
          handleBackdropClick = (event) => {
            if (event.target !== dialogEl) return;
            const rect = dialogEl.getBoundingClientRect();
            const isDialogContent =
              rect.top <= event.clientY &&
              event.clientY <= rect.top + rect.height &&
              rect.left <= event.clientX &&
              event.clientX <= rect.left + rect.width;
            if (isDialogContent) return;
            dialogEl.close();
          };
          dialogEl.addEventListener("click", handleBackdropClick);
        }

        return () => {
          dialogEl.removeEventListener("close", handleClose);
          if (handleBackdropClick) {
            dialogEl.removeEventListener("click", handleBackdropClick);
          }
        };
      }, []);

      // Open Native Modal Dialog when viewing patient intake & imaging
      const handleOpenPatientModal = (patient) => {
        setActiveModalPatient(patient);
        const dialogEl = intakeDialogRef.current;
        if (dialogEl && !dialogEl.open) {
          dialogEl.showModal();
        }
      };

      const handleClosePatientModal = () => {
        const dialogEl = intakeDialogRef.current;
        if (dialogEl && dialogEl.open) {
          dialogEl.close();
        }
      };

      // Send WhatsApp Reminder Action on Roster Row
      const handleSendRosterWhatsapp = (patient) => {
        setWhatsappSentMap((prev) => ({ ...prev, [patient.id]: true }));
        triggerToast(t.adminView.whatsappToast(patient.patientName, patient.langBadge));
      };

      // Toggle Clinic Day vs. Operating Room (Quirófano) Day
      const handleToggleClinicDay = (dayCode) => {
        setWeeklySchedule((prev) =>
          prev.map((d) =>
            d.dayCode === dayCode ? { ...d, inClinic: !d.inClinic } : d
          )
        );
      };

      // Filtered Roster Patients
      const filteredRoster = useMemo(() => {
        const list = clinicData.adminDashboard.roster;
        if (rosterFilter === "post-op") {
          return list.filter((p) => p.visitType.en === "Post-Op Follow-Up");
        }
        if (rosterFilter === "es") {
          return list.filter((p) => p.langBadge === "ES");
        }
        return list;
      }, [rosterFilter, clinicData.adminDashboard.roster]);

      // Selected Objects for Patient Booking View
      const selectedVisit = useMemo(
        () =>
          clinicData.appointmentTypes.find((v) => v.id === selectedVisitId) ||
          clinicData.appointmentTypes[0],
        [selectedVisitId, clinicData.appointmentTypes]
      );

      const allSlots = useMemo(
        () => [...clinicData.timeSlots.morning, ...clinicData.timeSlots.afternoon],
        [clinicData.timeSlots]
      );

      const selectedSlot = useMemo(
        () => allSlots.find((s) => s.id === selectedSlotId) || allSlots[0],
        [selectedSlotId, allSlots]
      );

      const selectedJointObj = useMemo(
        () =>
          clinicData.injuredJoints.find((j) => j.id === patientForm.injuredJoint) ||
          clinicData.injuredJoints[0],
        [patientForm.injuredJoint, clinicData.injuredJoints]
      );

      const selectedInsuranceObj = useMemo(
        () =>
          clinicData.insurances.find((ins) => ins.id === patientForm.insuranceId) ||
          clinicData.insurances[0],
        [patientForm.insuranceId, clinicData.insurances]
      );

      const monthCells = useMemo(
        () => buildMonthDays(calYear, calMonth),
        [calYear, calMonth]
      );

      const formattedSelectedDate = useMemo(() => {
        if (!selectedDateIso) return "";
        const [y, m, d] = selectedDateIso.split("-").map(Number);
        const dateObj = new Date(y, m - 1, d);
        const weekdayName = t.weekdaysShort[dateObj.getDay()];
        const monthName = t.months[m - 1];
        return lang === "es"
          ? `${weekdayName}, ${d} de ${monthName} ${y}`
          : `${weekdayName}, ${monthName} ${d}, ${y}`;
      }, [selectedDateIso, lang, t]);

      const triggerToast = (message) => {
        setStatusToast(message);
        setTimeout(() => {
          setStatusToast("");
        }, 3500);
      };

      // Deferred validation sync (:user-invalid + ARIA + fallback)
      const syncInputAriaAndFallback = (inputEl, eventType) => {
        if (!inputEl || typeof inputEl.checkValidity !== "function") return;
        const map = dirtyFieldsRef.current;
        const state = map.get(inputEl) || { hasInteracted: false, hasBlurred: false };

        if (eventType === "input" || eventType === "change") {
          state.hasInteracted = true;
          map.set(inputEl, state);
          if (state.hasBlurred) {
            const valid = inputEl.checkValidity();
            inputEl.classList.toggle("user-invalid-fallback", !valid);
            inputEl.classList.toggle("user-valid-fallback", valid);
            inputEl.setAttribute("aria-invalid", valid ? "false" : "true");
          } else if (inputEl.hasAttribute("aria-invalid")) {
            const valid = inputEl.checkValidity();
            inputEl.setAttribute("aria-invalid", valid ? "false" : "true");
          }
        } else if (eventType === "blur") {
          state.hasBlurred = true;
          map.set(inputEl, state);
          if (state.hasInteracted) {
            const valid = inputEl.checkValidity();
            inputEl.classList.toggle("user-invalid-fallback", !valid);
            inputEl.classList.toggle("user-valid-fallback", valid);
            inputEl.setAttribute("aria-invalid", valid ? "false" : "true");
          }
        }
      };

      const handleAutoFill = () => {
        const sample = clinicData.samplePatients[lang];
        setPatientForm({
          fullName: sample.fullName,
          email: sample.email,
          phone: sample.phone,
          insuranceId: sample.insuranceId,
          memberId: sample.memberId,
          injuredJoint: sample.injuredJoint,
          injurySide: sample.injurySide,
          clinicalNotes: sample.clinicalNotes,
          hasImaging: sample.hasImaging,
          smsOptIn: sample.smsOptIn
        });

        if (formRef.current) {
          const inputs = formRef.current.querySelectorAll(".ortho-input");
          inputs.forEach((el) => {
            el.classList.remove("user-invalid-fallback");
            el.classList.add("user-valid-fallback");
            el.setAttribute("aria-invalid", "false");
          });
        }
        triggerToast(t.wizard.autoFillToast);
      };

      const handleIntakeSubmit = (e) => {
        e.preventDefault();
        const formEl = e.currentTarget;
        if (!formEl.checkValidity()) {
          const inputs = formEl.querySelectorAll(".ortho-input");
          inputs.forEach((el) => {
            const valid = el.checkValidity();
            el.classList.toggle("user-invalid-fallback", !valid);
            el.setAttribute("aria-invalid", valid ? "false" : "true");
          });
          const firstInvalid = formEl.querySelector(":invalid");
          if (firstInvalid) firstInvalid.focus();
          return;
        }
        setIsSubmitting(true);
        setTimeout(() => {
          setIsSubmitting(false);
          setStep(4);
          window.scrollTo({ top: 0, behavior: "smooth" });
        }, 180);
      };

      const handleDownloadIcs = () => {
        const [y, m, d] = selectedDateIso.split("-");
        const startHour = parseInt(selectedSlot.id.split(":")[0], 10);
        const startMin = parseInt(selectedSlot.id.split(":")[1], 10);
        const dtStart = `${y}${m}${d}T${String(startHour).padStart(2, "0")}${String(startMin).padStart(2, "0")}00`;
        const endTotalMin = startHour * 60 + startMin + selectedVisit.durationMinutes;
        const endHour = Math.floor(endTotalMin / 60);
        const endMin = endTotalMin % 60;
        const dtEnd = `${y}${m}${d}T${String(endHour).padStart(2, "0")}${String(endMin).padStart(2, "0")}00`;

          "BEGIN:VCALENDAR",
          "VERSION:2.0",
          "PRODID:-//Montes Orthopedics//Bilingual Booking//EN",
          "BEGIN:VEVENT",
          `UID:MON-4092@montesortho.example.com`,
          `DTSTART:${dtStart}`,
          `DTEND:${dtEnd}`,
          `SUMMARY:${selectedVisit.title[lang]} - ${doctor.name}`,
          `LOCATION:${doctor.clinic.name}, ${doctor.clinic.addressLine1}, ${doctor.clinic.cityStateZip}`,
          `DESCRIPTION:Ref #MON-4092 | Joint: ${selectedJointObj.label[lang]} | Prep: ${selectedVisit.prepInstructions[lang]}`,
          "END:VEVENT",
          "END:VCALENDAR"
        ].join("\r\n");

        const blob = new Blob([icsContent], { type: "text/calendar;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "Dr-Luis-Montes-Appointment-MON-4092.ics";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        triggerToast(t.wizard.calendarAddedToast);
      };

        if (calMonth === 0) {
          setCalYear((y) => y - 1);
          setCalMonth(11);
        } else {
          setCalMonth((m) => m - 1);
        }
      };

          setCalYear((y) => y + 1);
          setCalMonth(0);

                            </button>
                            <button
                              type="button"
                              onClick={handleDownloadIcs}
                              className="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-white hover:bg-slate-50 text-slate-800 border border-slate-300 text-xs font-semibold transition-colors"
                            >
                              <span>📥 {t.wizard.downloadIcs}</span>
                            </button>
                            <button
                              type="button"
                              onClick={() => window.print()}
                              className="inline-flex items-center gap-2 px-3.5 py-2.5 rounded-xl bg-white hover:bg-slate-50 text-slate-700 border border-slate-300 text-xs font-semibold transition-colors"
                            >
                              <span>🖨️ {t.wizard.printSummary}</span>
                            </button>
                          </div>
                        </div>

                        <div className="space-y-3">
                          <div className="flex flex-wrap items-center justify-between gap-2">
                            <div>
                              <h3 className="text-sm font-bold text-slate-900">
                                📱 {t.wizard.iphonePreviewTitle}
                              </h3>
                              <p className="text-xs text-slate-500">
                                {t.wizard.iphonePreviewSubtitle}
                              </p>
                            </div>
                            <span className="inline-flex items-center gap-1.5 text-xs font-semibold text-emerald-700 bg-emerald-50 px-2.5 py-1 rounded-full border border-emerald-200">
                              <span className="w-2 h-2 rounded-full bg-emerald-500" />
                              {lang === "es" ? "Idioma Activo: Español" : "Active Language: English"}
                            </span>
                          </div>

                          <div className="max-w-md mx-auto bg-slate-900 rounded-[2.25rem] p-3 shadow-xl border-4 border-slate-800">
                            <div className="w-28 h-4 bg-black rounded-full mx-auto mb-2.5 flex items-center justify-end px-2">
                              <span className="w-2 h-2 rounded-full bg-emerald-500/80" />
                            </div>

                            <div className="bg-[#efeae2] rounded-[1.75rem] overflow-hidden text-slate-900">
                              <div className="bg-[#075e54] text-white px-4 py-3 flex items-center gap-3">
                                <div className="w-9 h-9 rounded-full bg-white/20 flex items-center justify-center font-bold text-xs shrink-0">
                                  LM
                                </div>
                                <div className="min-w-0 flex-1">
                                  <div className="text-xs font-bold truncate flex items-center gap-1">
                                    <span>Dr. Luis Montes, MD, FAAOS</span>
                                    <span aria-hidden="true" className="text-emerald-300">✔</span>
                                  </div>
                                  <div className="text-[10px] text-emerald-100 truncate">
                                    {t.wizard.iphoneHeaderStatus}
                                  </div>
                                </div>
                              </div>

                              <div className="p-3.5 space-y-3 text-xs">
                                <div className="bg-white rounded-2xl rounded-tl-sm p-3 shadow-sm border border-slate-200/70 whitespace-pre-line leading-relaxed text-slate-800">
                                  {t.wizard.iphoneMessageBody({
                                    patientName: patientForm.fullName || "Mateo Rivera",
                                    dateStr: formattedSelectedDate,
                                    timeStr: selectedSlot.label,
                                    visitTitle: selectedVisit.title[lang],
                                    jointLabel: `${selectedJointObj.label[lang]} - ${sideDisplayLabel}`,
                                    prepText: selectedVisit.prepInstructions[lang]
                                  })}
                                  <div className="text-[10px] text-slate-400 text-right mt-1">
                                    Just now • Automated Clinic SMS/WhatsApp
                                  </div>
                                </div>

                                <div className="bg-[#dcf8c6] rounded-2xl rounded-tr-sm p-2.5 shadow-sm border border-emerald-200/80 ml-12 text-slate-900">
                                  <div className="font-medium">{t.wizard.iphonePatientReply}</div>
                                  <div className="text-[10px] text-emerald-700 text-right mt-0.5">
                                    ✓✓
                                  </div>
                                </div>
                              </div>
                            </div>
                          </div>
                        </div>

                        <div className="pt-4 border-t border-slate-200 flex items-center justify-between">
                          <button
                            type="button"
                            onClick={() => setStep(3)}
                            className="text-xs font-semibold text-slate-600 hover:text-slate-900 underline"
                          >
                            ← {lang === "es" ? "Editar datos del paciente" : "Edit patient details"}
                          </button>
                          <button
                            type="button"
                            onClick={() => setStep(1)}
                            className="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-semibold transition-colors"
                          >
                            {t.wizard.bookAnotherBtn}
                          </button>
                        </div>
                      </section>
                    )}
                  </div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
