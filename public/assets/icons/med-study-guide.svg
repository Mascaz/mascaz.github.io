    <linearGradient id="med-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#med-bg)"/>
  <rect x="18" y="18" width="220" height="106" rx="42" fill="url(#med-glass)"/>
