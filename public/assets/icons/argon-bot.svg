<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b19"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="emeraldGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="violetGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <!-- Matrix Grid Lines -->
  <g stroke="#38bdf8" stroke-opacity="0.14" stroke-width="2">
    <line x1="32" y1="64" x2="224" y2="64"/>
    <line x1="32" y1="112" x2="224" y2="112"/>
    <line x1="32" y1="160" x2="224" y2="160"/>
    <line x1="32" y1="208" x2="224" y2="208"/>
    <line x1="64" y1="32" x2="64" y2="224"/>
    <line x1="128" y1="32" x2="128" y2="224"/>
    <line x1="192" y1="32" x2="192" y2="224"/>
  </g>
  <!-- FX Candlesticks -->
  <!-- Candle 1 -->
  <line x1="56" y1="126" x2="56" y2="196" stroke="#f43f5e" stroke-width="4" stroke-linecap="round"/>
  <rect x="46" y="142" width="20" height="36" rx="4" fill="#f43f5e"/>
  <!-- Candle 2 -->
  <line x1="94" y1="104" x2="94" y2="178" stroke="#34d399" stroke-width="4" stroke-linecap="round"/>
  <rect x="84" y="118" width="20" height="44" rx="4" fill="url(#emeraldGlow)"/>
  <!-- Candle 3 -->
  <line x1="132" y1="86" x2="132" y2="152" stroke="#34d399" stroke-width="4" stroke-linecap="round"/>
  <rect x="122" y="96" width="20" height="38" rx="4" fill="url(#emeraldGlow)"/>
  <!-- Candle 4 -->
  <line x1="170" y1="94" x2="170" y2="148" stroke="#f43f5e" stroke-width="4" stroke-linecap="round"/>
  <rect x="160" y="106" width="20" height="24" rx="4" fill="#f43f5e"/>
  <!-- Candle 5 -->
  <line x1="206" y1="52" x2="206" y2="124" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  <rect x="196" y="64" width="20" height="46" rx="4" fill="url(#cyanGlow)"/>
  <!-- 3-Layer Signal Curve -->
  <path d="M 36 184 Q 82 162, 118 124 T 220 68" fill="none" stroke="url(#violetGlow)" stroke-width="6" stroke-linecap="round"/>
  <!-- Argon AI Sparkle Badge -->
  <g transform="translate(68, 66)">
    <path d="M0,-24 C4,-6 6,-4 24,0 C6,4 4,6 0,24 C-4,6 -6,4 -24,0 C-6,-4 -4,-6 0,-24 Z" fill="#e879f9"/>
    <circle cx="0" cy="0" r="5" fill="#ffffff"/>
  </g>
</svg>
