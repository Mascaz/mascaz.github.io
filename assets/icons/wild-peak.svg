<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b1447"/>
      <stop offset="50%" stop-color="#6b2d5c"/>
      <stop offset="100%" stop-color="#f28549"/>
    </linearGradient>
    <linearGradient id="lava" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff36b"/>
      <stop offset="45%" stop-color="#ff6b1a"/>
      <stop offset="100%" stop-color="#b81d13"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#sky)"/>
  <!-- Retro N64 Sun -->
  <circle cx="128" cy="86" r="44" fill="#ffcf56" opacity="0.88"/>
